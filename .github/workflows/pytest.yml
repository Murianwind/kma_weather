name: Pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-freezegun \
                      pytest-homeassistant-custom-component \
                      coverage pytest-cov

          if [ -f custom_components/kma_weather/manifest.json ]; then
            REQ_LIST=$(jq -r '.requirements[]?' custom_components/kma_weather/manifest.json)
            if [ -n "$REQ_LIST" ]; then
              pip install $REQ_LIST
            fi
          fi

      - name: Download skyfield ephemeris (de440s.bsp)
        run: |
          python -c "
          import os, tempfile
          from skyfield.api import Loader
          cache_dir = os.path.join(tempfile.gettempdir(), 'skyfield_test_cache')
          os.makedirs(cache_dir, exist_ok=True)
          load = Loader(cache_dir)
          load.timescale()
          load('de440s.bsp')
          print('de440s.bsp 다운로드 완료')
          "

      - name: Run Pytest with Coverage
        run: |
          set +e
          pytest tests/ \
            --cov=custom_components.kma_weather \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --no-header \
            --tb=short \
            --color=no \
            --durations=10 \
            -p no:warnings \
            -v \
            2>&1 | tee pytest-coverage.txt
          PYTEST_EXIT=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=$PYTEST_EXIT" >> $GITHUB_ENV
          exit $PYTEST_EXIT

      - name: Publish Test Summary
        if: always()
        run: |
          SUMMARY_LINE=$(grep -E "[0-9]+ (passed|failed|error)" pytest-coverage.txt | tail -1 || true)

          # ── 헤더 + 요약 ──────────────────────────────────────────────────────
          if [ "${PYTEST_EXIT:-0}" = "0" ]; then
            echo "### ✅ Pytest 결과: 전체 통과" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Pytest 결과: 실패 있음" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**${SUMMARY_LINE}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── 실행된 테스트 전체 목록 (접기) ──────────────────────────────────
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>📋 실행된 테스트 전체 목록 (클릭하여 펼치기)</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "PASSED|FAILED|ERROR|SKIPPED" pytest-coverage.txt \
            | grep "::" \
            | sed 's/  *\[[ 0-9]*%\]$//' \
            | sed 's/ PASSED$/  ✓/' \
            | sed 's/ FAILED$/  ✗  ← FAILED/' \
            | sed 's/ ERROR$/  !  ← ERROR/' \
            | sed 's/ SKIPPED$/  (skipped)/' \
            >> $GITHUB_STEP_SUMMARY || echo "(없음)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # ── 실패 상세 ────────────────────────────────────────────────────────
          FAIL_COUNT=$(grep -cE "^(FAILED|ERROR) " pytest-coverage.txt 2>/dev/null || echo 0)
          if [ "$FAIL_COUNT" -gt "0" ]; then
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ 실패 상세" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "**실패한 테스트:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^(FAILED|ERROR) " pytest-coverage.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "**Traceback (파일:라인):**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            awk '
              /^_{5,}/ { in_fail=1; block=""; print ""; print; next }
              in_fail && /^(FAILED|ERROR|={5,})/ { in_fail=0; next }
              in_fail && /^[[:space:]]*(tests|custom_components)\/.*\.py:[0-9]+:/ { print; next }
              in_fail && /^E[[:space:]]/ { print; next }
            ' pytest-coverage.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "**원인 분류:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            SRC=$(grep -oE "custom_components/[^ ]+\.py:[0-9]+" pytest-coverage.txt | sort -u || true)
            TEST=$(grep -oE "tests/[^ ]+\.py:[0-9]+" pytest-coverage.txt | sort -u || true)

            if [ -n "$SRC" ]; then
              echo "📦 소스 코드 문제 (custom_components/):" >> $GITHUB_STEP_SUMMARY
              echo "$SRC" >> $GITHUB_STEP_SUMMARY
              echo "  → sensor.py / coordinator.py 등 실제 코드 버그일 가능성" >> $GITHUB_STEP_SUMMARY
            else
              echo "📦 소스 코드 문제: 없음" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ -n "$TEST" ]; then
              echo "🧪 테스트 코드 문제 (tests/):" >> $GITHUB_STEP_SUMMARY
              echo "$TEST" >> $GITHUB_STEP_SUMMARY
              echo "  → 테스트 assertion 또는 mock 설정 문제일 가능성" >> $GITHUB_STEP_SUMMARY
            else
              echo "🧪 테스트 코드 문제: 없음" >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate Detailed Statement Coverage Report
        if: always()
        run: |
          echo "### 📊 1. 구문 커버리지 상세 (Statement Coverage)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 파일 경로 | 전체 라인 수 | 실행 가능 구문 | 실행 안 됨 | 구문 커버리지(%) | 누락된 구문 라인 |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|---:|---:|---:|---:|:---|" >> $GITHUB_STEP_SUMMARY

          grep -E "^custom_components" pytest-coverage.txt | while read -r line; do
            FILE_PATH=$(echo $line | awk '{print $1}')
            STMTS=$(echo $line | awk '{print $2}')
            MISS=$(echo $line | awk '{print $3}')

            TOTAL_LINES=$(wc -l < "$FILE_PATH" | xargs)

            PER=$(awk -v s="$STMTS" -v m="$MISS" 'BEGIN {if (s > 0) printf "%.1f%%", ((s - m) / s) * 100; else print "0%"}')

            MISSING_RAW=$(echo $line | awk '{for(i=7;i<=NF;i++) printf "%s ", $i}')
            MISSING_LINES=$(echo $MISSING_RAW | tr ' ' '\n' | grep -v "\->" | tr '\n' ' ' | sed 's/ $//')

            if [ -z "$MISSING_LINES" ]; then MISSING_LINES="-"; fi

            echo "| $FILE_PATH | $TOTAL_LINES | $STMTS | $MISS | **$PER** | $MISSING_LINES |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Generate Detailed Branch Coverage Report
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌿 2. 분기 커버리지 상세 (Branch Coverage)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 파일 경로 | 전체 분기 수 | 실행된 분기 | 실행 안 됨 | 분기 커버리지(%) | 누락된 분기 (화살표) |" >> $GITHUB_STEP_SUMMARY
          echo "|:---|---:|---:|---:|---:|:---|" >> $GITHUB_STEP_SUMMARY

          grep -E "^custom_components" pytest-coverage.txt | while read -r line; do
            FILE_PATH=$(echo $line | awk '{print $1}')
            BRANCH=$(echo $line | awk '{print $4}')
            BR_MISS=$(echo $line | awk '{print $5}')

            PER=$(awk -v b="$BRANCH" -v m="$BR_MISS" 'BEGIN {if (b > 0) printf "%.1f%%", ((b - m) / b) * 100; else print "-"}')

            MISSING_RAW=$(echo $line | awk '{for(i=7;i<=NF;i++) printf "%s ", $i}')
            MISSING_BRANCHES=$(echo $MISSING_RAW | tr ' ' '\n' | grep "\->" | tr '\n' ' ' | sed 's/ $//')

            if [ -z "$MISSING_BRANCHES" ]; then MISSING_BRANCHES="-"; fi

            if [ "$BRANCH" -eq 0 ]; then
              echo "| $FILE_PATH | 0 | 0 | 0 | - | - |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $FILE_PATH | $BRANCH | $(($BRANCH - $BR_MISS)) | $BR_MISS | **$PER** | $MISSING_BRANCHES |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Generate Final Summary
        if: always()
        run: |
          TOTAL_LINE=$(grep "^TOTAL" pytest-coverage.txt)
          STMTS=$(echo $TOTAL_LINE | awk '{print $2}')
          MISS=$(echo $TOTAL_LINE | awk '{print $3}')
          BRANCH=$(echo $TOTAL_LINE | awk '{print $4}')
          BR_MISS=$(echo $TOTAL_LINE | awk '{print $5}')

          STMT_PER=$(awk -v s="$STMTS" -v m="$MISS" 'BEGIN {if (s > 0) printf "%.2f%%", ((s - m) / s) * 100; else print "0%"}')
          BRANCH_PER=$(awk -v b="$BRANCH" -v m="$BR_MISS" 'BEGIN {if (b > 0) printf "%.2f%%", ((b - m) / b) * 100; else print "0%"}')

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 최종 커버리지 요약" >> $GITHUB_STEP_SUMMARY
          echo "| 측정 방식 | 커버리지율 | 상세 수치 (성공/전체) |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **구문(Statement)** | **$STMT_PER** | $(($STMTS - $MISS)) / $STMTS |" >> $GITHUB_STEP_SUMMARY
          echo "| **분기(Branch)** | **$BRANCH_PER** | $(($BRANCH - $BR_MISS)) / $BRANCH |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true
